<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebCrawler Search</title><style>body{max-width:760px;margin:4rem auto;font:16px system-ui;color:#172033;padding:0 1rem}input{width:72%;padding:.7rem;font:inherit}button{padding:.7rem 1rem}article{margin:1.6rem 0}a{color:#1856b8}p{line-height:1.45;color:#4d586b}</style></head><body><h1>WebCrawler Search</h1><form><input autofocus name="q" placeholder="Search the corpus"><button>Search</button></form><main></main><script>const f=document.querySelector('form'),m=document.querySelector('main');f.onsubmit=async e=>{e.preventDefault();let q=new FormData(f).get('q');let d=await fetch('/search?q='+encodeURIComponent(q)).then(x=>x.json());m.innerHTML=(d.results||[]).map(r=>`<article><a href="${r.url}"><h2>${r.title||r.url}</h2></a><p>${r.snippet}</p></article>`).join('')||'<p>No results.</p>'}</script></body></html>
