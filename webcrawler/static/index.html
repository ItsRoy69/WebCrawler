<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebCrawler Search</title><style>body{max-width:760px;margin:4rem auto;font:16px system-ui;color:#172033;padding:0 1rem}input{width:72%;padding:.7rem;font:inherit}button{padding:.7rem 1rem}article{margin:1.6rem 0}a{color:#1856b8}p{line-height:1.45;color:#4d586b}</style></head><body><h1>WebCrawler Search</h1><form><input autofocus name="q" placeholder="Search text or enter a site URL"><button>Search</button></form><p id="status"></p><main></main><script>const f=document.querySelector('form'),m=document.querySelector('main'),s=document.querySelector('#status'),b=f.querySelector('button');f.onsubmit=async e=>{e.preventDefault();let q=new FormData(f).get('q').trim();if(!q)return;s.textContent=/^https?:\/\//i.test(q)?'Crawling this site (up to 25 pages; this can take a little while)…':'Searching…';b.disabled=true;m.innerHTML='';try{let r=await fetch('/search?q='+encodeURIComponent(q));let d=await r.json();if(!r.ok)throw new Error(d.detail||'Request failed');s.textContent=d.crawled?'Crawl complete.':'Search complete.';m.innerHTML=(d.results||[]).map(r=>`<article><a href="${r.url}"><h2>${r.title||r.url}</h2></a><p>${r.snippet}</p></article>`).join('')||'<p>No results found.</p>'}catch(err){s.textContent='Error: '+err.message}finally{b.disabled=false}}</script></body></html>
