[project]
name = "webcrawler"
version = "0.1.0"
description = "A bounded web crawler and corpus ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=2.0",
  "uvicorn[standard]>=0.30",
  "warcio>=1.7",
]

[project.scripts]
webcrawler = "webcrawler.cli:main"
webcrawler-api = "webcrawler.api:run"

[tool.setuptools.packages.find]
include = ["webcrawler*"]

[tool.setuptools.package-data]
webcrawler = ["static/*.html", "static/dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
