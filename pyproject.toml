[project]
name = "webcrawler"
version = "0.1.0"
description = "A bounded web crawler and hybrid search engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ItsRoy69" }]

dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=2.0",
  "uvicorn[standard]>=0.30",
  "warcio>=1.7",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
webcrawler = "webcrawler.cli:main"
webcrawler-api = "webcrawler.api:run"

[project.urls]
Homepage = "https://github.com/ItsRoy69/WebCrawler"
Repository = "https://github.com/ItsRoy69/WebCrawler"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["webcrawler*"]

[tool.setuptools.package-data]
webcrawler = [
  "static/*.html",
  "static/dist/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"